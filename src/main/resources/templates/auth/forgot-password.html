<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body class="bg-light">
<div th:replace="fragments/header :: header"></div>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4">
        <h3 class="text-center mb-3">Forgot Password</h3>
        <form onsubmit="forgotPassword(event)">
          <div class="mb-3"><label>Email</label><input id="fpEmail" type="email" class="form-control" required/></div>
          <button class="btn btn-primary w-100" type="submit">Send reset link</button>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
async function forgotPassword(e){e.preventDefault();try{const email=document.getElementById('fpEmail').value;const result=await API.post('/api/auth/forgot-password',{email});alert(result.message||'Request completed.');}catch(error){showModal('error','Request failed',error.message);}}
</script>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
