<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body class="bg-light">
<div th:replace="fragments/header :: publicHeader"></div>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4">
        <h3 class="text-center mb-3">Đặt lại mật khẩu</h3>
        <p class="text-muted text-center">Tạo mật khẩu mới cho tài khoản ALOUTE của bạn.</p>
        <div id="resetTokenError" class="alert alert-danger" role="alert" hidden>
          Liên kết đặt lại mật khẩu không hợp lệ hoặc thiếu token. Vui lòng yêu cầu liên kết mới.
        </div>
        <form id="resetPasswordForm" onsubmit="resetPassword(event)">
          <input id="rpToken" type="hidden"/>
          <div class="mb-3">
            <label class="form-label" for="rpPassword">Mật khẩu mới</label>
            <input id="rpPassword" type="password" class="form-control" required minlength="6" autocomplete="new-password"/>
          </div>
          <button id="resetPasswordButton" class="btn btn-primary w-100" type="submit">Đặt lại mật khẩu</button>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
(() => {
  const token = new URLSearchParams(window.location.search).get('token');
  const tokenField = document.getElementById('rpToken');
  const submitButton = document.getElementById('resetPasswordButton');
  tokenField.value = token || '';
  if (!token) {
    document.getElementById('resetTokenError').hidden = false;
    submitButton.disabled = true;
  }
})();

async function resetPassword(event) {
  event.preventDefault();
  const token = document.getElementById('rpToken').value;
  if (!token) {
    document.getElementById('resetTokenError').hidden = false;
    return;
  }
  const button = document.getElementById('resetPasswordButton');
  button.disabled = true;
  try {
    const newPassword = document.getElementById('rpPassword').value;
    const result = await API.post('/api/auth/reset-password', { token, newPassword });
    showModal('success', 'Đổi mật khẩu thành công', result.message || 'Mật khẩu đã được cập nhật.');
    window.setTimeout(() => { window.location.href = '/login'; }, 1200);
  } catch (error) {
    showModal('error', 'Không thể đổi mật khẩu', error.message || 'Vui lòng thử lại.');
    button.disabled = false;
  }
}
</script>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
