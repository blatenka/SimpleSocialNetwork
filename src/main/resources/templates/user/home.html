<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: head"></head>
<body>
<div th:replace="fragments/header :: header"></div>
<main class="container-fluid container-xxl py-3 py-lg-4">
  <div class="row g-3 g-lg-4">
    <aside class="col-12 col-lg-3 col-xl-3">
      <div class="home-sidebar sidebar-sticky">
        <div class="card border-0 mb-3 d-none d-lg-block">
          <div class="card-body">
            <h1 class="h5 mb-1">Your community</h1>
            <p class="small text-muted mb-0">Catch up with friends and share what matters.</p>
          </div>
        </div>
        <div th:replace="fragments/sidebar :: sidebar"></div>
      </div>
    </aside>
    <section class="col-12 col-lg-9 col-xl-9" aria-labelledby="feedHeading">
      <div class="d-flex align-items-center justify-content-between mb-3 px-1">
        <div>
          <h1 id="feedHeading" class="h3 mb-1">Newsfeed</h1>
          <p class="text-muted mb-0">The latest from your community</p>
        </div>
        <span class="badge rounded-pill text-bg-primary px-3 py-2">ALOUTE</span>
      </div>
      <section class="card border-0 mb-3" aria-labelledby="createPostHeading">
        <div class="card-body">
          <form id="createPostForm">
            <label class="visually-hidden" for="postContent">What's on your mind?</label>
            <textarea id="postContent" class="form-control mb-2" rows="3" maxlength="5000"
                      placeholder="What's on your mind?" required></textarea>
            <div id="postMediaPreview" class="small text-muted mb-2" aria-live="polite"></div>
            <div id="createPostError" class="alert alert-danger py-2" role="alert" hidden></div>
            <div id="createPostSuccess" class="alert alert-success py-2" role="status" hidden></div>
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 border-top pt-2">
              <div class="d-flex flex-wrap align-items-center gap-2">
                <label for="postMedia" class="btn btn-sm btn-outline-success mb-0">
                  <i class="fa fa-photo-film me-1" aria-hidden="true"></i>Add photos or video
                </label>
                <input id="postMedia" type="file" class="visually-hidden"
                       accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/ogg" multiple/>
                <span class="small text-muted">Up to 10 files · 25 MB each</span>
                <label class="visually-hidden" for="postPrivacy">Post privacy</label>
                <select id="postPrivacy" class="form-select form-select-sm" style="width:auto">
                  <option value="PUBLIC">Public</option>
                  <option value="FRIENDS">Friends</option>
                  <option value="PRIVATE">Only me</option>
                </select>
              </div>
              <button id="submitPost" class="btn btn-primary btn-sm px-4" type="submit">
                <i class="fa fa-paper-plane me-1" aria-hidden="true"></i>Post
              </button>
            </div>
          </form>
        </div>
      </section>
      <div id="feedLoading" class="card border-0 text-center text-muted py-4" role="status">Loading newsfeed...</div>
      <div id="feedError" class="alert alert-danger" role="alert" hidden>
        <span id="feedErrorMessage"></span>
        <button id="retryFeed" class="btn btn-sm btn-outline-danger ms-2" type="button">Retry</button>
      </div>
      <div id="feedEmpty" class="card border-0 text-center text-muted py-5" hidden>
        <i class="fa-regular fa-newspaper fa-2x mb-3" aria-hidden="true"></i>
        <h2 class="h5">Your feed is ready for a first post</h2>
        <p class="mb-0">Check back soon for updates from your community.</p>
      </div>
      <div id="feed" class="home-feed"></div>
      <button id="loadMoreFeed" class="btn btn-outline-primary d-block mx-auto my-3" type="button" hidden>Load more</button>
    </section>
  </div>
</main>
<div th:replace="fragments/footer :: footer"></div>
<script th:src="@{/js/social-interactions.js}"></script>
<script th:src="@{/js/home-feed.js}"></script>
<script th:src="@{/js/home-post-composer.js}"></script>
</body>
</html>
