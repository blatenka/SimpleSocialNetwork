<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Aloute</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/ajax-call.js}"></script>
    <script th:src="@{/js/websocket.js}"></script>
</head>
<body>
<nav th:fragment="publicHeader" class="navbar navbar-expand navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="fa-solid fa-users"></i> Aloute</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/login}">Login</a>
            <a class="nav-link" th:href="@{/register}">Register</a>
        </div>
    </div>
</nav>
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/home}"><i class="fa-solid fa-users"></i> Aloute</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <form class="d-flex me-auto ms-3" onsubmit="searchGlobal(event)">
                <input id="globalSearch" class="form-control me-2" type="search" placeholder="Search friends or posts..."/>
                <button class="btn btn-outline-light" type="submit"><i class="fa fa-search"></i></button>
            </form>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" th:href="@{/home}"><i class="fa fa-home"></i> Home</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/chat}"><i class="fa fa-comments"></i> Chat</a></li>
                <li class="nav-item dropdown" id="notificationDropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" aria-expanded="false"><i class="fa fa-bell"></i> <span id="notifCount" class="badge bg-danger">0</span></a>
                    <ul class="dropdown-menu dropdown-menu-end" id="notifList" style="min-width:300px; max-height:400px; overflow:auto;">
                        <li><span class="dropdown-item-text text-muted">No notifications</span></li>
                    </ul>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown"><i class="fa fa-user"></i> <span id="navUserName">Me</span></a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/myprofile}">My Profile</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin}" id="adminLink" style="display:none;">Admin</a></li>
                        <li><hr class="dropdown-divider"/></li>
                        <li><a class="dropdown-item" href="#" onclick="logout()">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
