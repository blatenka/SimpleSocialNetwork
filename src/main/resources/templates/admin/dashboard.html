<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container-fluid container-xxl py-4">
  <div class="row g-4">
    <aside class="col-12 col-lg-3 col-xl-2">
      <div th:replace="~{fragments/admin-nav :: adminNav}"></div>
    </aside>
    <section class="col-12 col-lg-9 col-xl-10">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div><h1 class="h3 mb-1">Admin dashboard</h1><p class="text-muted mb-0">ALOUTE platform overview</p></div>
        <button id="refreshDashboard" class="btn btn-outline-primary" type="button"><i class="fa fa-rotate me-1"></i>Refresh</button>
      </div>
      <div id="dashboardError" class="alert alert-danger" role="alert" hidden></div>
      <div id="dashboardLoading" class="text-center text-muted py-5" role="status">Loading platform statistics...</div>
      <div id="dashboardCards" class="row g-3" aria-live="polite"></div>
      <div class="row g-3 mt-2">
        <div class="col-12 col-xl-6">
          <div class="card h-100 border-0">
            <div class="card-body">
              <h2 class="h5">Management</h2>
              <p class="text-muted">Review accounts and moderate reported or inappropriate content.</p>
              <a class="btn btn-primary me-2 mb-2" th:href="@{/admin/users}">Manage users</a>
              <a class="btn btn-outline-primary mb-2" th:href="@{/admin/posts}">Manage posts</a>
            </div>
          </div>
        </div>
        <div class="col-12 col-xl-6">
          <div class="card h-100 border-0"><div class="card-body">
            <h2 class="h5">System status</h2>
            <p class="text-muted">Review database connectivity and detailed engagement statistics.</p>
            <a class="btn btn-outline-secondary" th:href="@{/admin/system}">Open system report</a>
          </div></div>
        </div>
      </div>
    </section>
  </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/admin-dashboard.js}"></script>
</body>
</html>
