<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="container-fluid container-xxl py-4">
  <div class="row g-4">
    <aside class="col-12 col-lg-3 col-xl-2"><div th:replace="~{fragments/admin-nav :: adminNav}"></div></aside>
    <section class="col-12 col-lg-9 col-xl-10">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div><h1 class="h3 mb-1">Users</h1><p class="text-muted mb-0">Search and manage account status and profile details.</p></div>
        <button id="createUserButton" class="btn btn-primary" type="button"><i class="fa fa-user-plus me-1"></i>Create user</button>
      </div>
      <form id="userSearchForm" class="card card-body border-0 mb-3">
        <div class="row g-2">
          <div class="col-12 col-md-6"><label class="visually-hidden" for="userSearch">Search users</label><input id="userSearch" class="form-control" maxlength="100" placeholder="Search name or email"/></div>
          <div class="col-6 col-md-3"><label class="visually-hidden" for="userSort">Sort users</label><select id="userSort" class="form-select"><option value="createdAt">Registration date</option><option value="id">ID</option><option value="email">Email</option><option value="role">Role</option><option value="status">Status</option></select></div>
          <div class="col-6 col-md-2"><label class="visually-hidden" for="userDirection">Sort order</label><select id="userDirection" class="form-select"><option value="desc">Newest first</option><option value="asc">Oldest first</option></select></div>
          <div class="col-12 col-md-1 d-grid"><button class="btn btn-outline-primary" type="submit" aria-label="Search"><i class="fa fa-search"></i></button></div>
        </div>
      </form>
      <div id="usersError" class="alert alert-danger" role="alert" hidden></div>
      <div class="card border-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr><th>ID</th><th>User</th><th>Email</th><th>Role</th><th>Status</th><th>Registered</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="userTable"><tr><td colspan="7" class="text-center text-muted py-4">Loading users...</td></tr></tbody>
          </table>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3">
        <span id="userPageLabel" class="small text-muted" aria-live="polite"></span>
        <div class="btn-group"><button id="previousUserPage" class="btn btn-outline-secondary btn-sm" type="button">Previous</button><button id="nextUserPage" class="btn btn-outline-secondary btn-sm" type="button">Next</button></div>
      </div>
    </section>
  </div>
</main>
<div class="modal fade" id="userDetailsModal" tabindex="-1" aria-labelledby="userDetailsTitle" aria-hidden="true">
  <div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5" id="userDetailsTitle">User details</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body" id="userDetailsBody"></div></div></div>
</div>
<div class="modal fade" id="userEditorModal" tabindex="-1" aria-labelledby="userEditorTitle" aria-hidden="true">
  <div class="modal-dialog"><div class="modal-content">
    <form id="userEditorForm">
      <div class="modal-header"><h2 class="modal-title fs-5" id="userEditorTitle">Create user</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <div id="userEditorError" class="alert alert-danger" role="alert" hidden></div>
        <label class="form-label" for="editorEmail">Email</label><input id="editorEmail" type="email" class="form-control mb-3" maxlength="100" required/>
        <div id="passwordField"><label class="form-label" for="editorPassword">Temporary password</label><input id="editorPassword" type="password" class="form-control mb-3" minlength="8" maxlength="72" autocomplete="new-password"/></div>
        <label class="form-label" for="editorFullname">Full name</label><input id="editorFullname" class="form-control mb-3" maxlength="100" required/>
        <label class="form-label" for="editorNickname">Nickname</label><input id="editorNickname" class="form-control mb-3" maxlength="50"/>
        <div id="statusField" hidden><label class="form-label" for="editorStatus">Account status</label><select id="editorStatus" class="form-select"><option value="ACTIVE">Active</option><option value="BANNED">Suspended</option></select></div>
        <p id="roleAssignmentNote" class="small text-muted mb-0">New accounts receive the standard USER role. Administrator privileges cannot be assigned here.</p>
      </div>
      <div class="modal-footer"><button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancel</button><button id="saveUserButton" class="btn btn-primary" type="submit">Create user</button></div>
    </form>
  </div></div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/admin-users.js}"></script>
</body>
</html>
